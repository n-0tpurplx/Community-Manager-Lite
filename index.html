<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Manager Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Community Manager Lite</h1>
    <p class="sub">ERLC Control Panel (Prototype v0.1)</p>

    <div class="card">
      <h2>Authentication</h2>

      <button onclick="loginWithDiscord()">
        Login with Discord
      </button>

      <p id="authStatus">Status: Not logged in</p>
    </div>

    <!-- NEW COMMAND SECTION -->
    <div class="card">
      <h2>Command Console</h2>

      <button onclick="toggleCommandBox()">
        Run Command
      </button>

      <div id="commandBox" style="display:none; margin-top:10px;">
        <input
          type="text"
          id="commandInput"
          placeholder="Enter command..."
          style="padding:10px; width:80%;"
        />

        <button onclick="fakeRunCommand()">
          Execute
        </button>

        <p id="commandStatus"></p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
